<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: none; }
      .orange { stroke: #ff8c00; stroke-width: 8; stroke-linecap: round; fill: none; }
      .cyan { stroke: #00bcd4; stroke-width: 8; stroke-linecap: round; fill: none; }
      .white { stroke: #ffffff; stroke-width: 8; stroke-linecap: round; fill: none; stroke-linejoin: round; }
      .dot-orange { fill: #ff8c00; }
      .dot-cyan { fill: #00bcd4; }
      .dot-white { fill: #ffffff; }
    </style>
  </defs>
  <rect class="bg" width="400" height="400" />
  
  <!-- Left Arc (Orange) -->
  <path class="orange" d="M 185,63 A 125,125 0 0,0 165,308" />
  <circle class="dot-orange" cx="185" cy="63" r="6" />
  <circle class="dot-orange" cx="165" cy="308" r="6" />

  <!-- Right Arc (Cyan) -->
  <path class="cyan" d="M 215,63 A 125,125 0 0,1 180,313" />
  <circle class="dot-cyan" cx="215" cy="63" r="6" />
  <circle class="dot-cyan" cx="180" cy="313" r="6" />

  <!-- Letter I -->
  <line class="white" x1="200" y1="40" x2="200" y2="270" />
  <circle class="dot-white" cx="200" cy="40" r="6" />
  <circle class="dot-white" cx="200" cy="270" r="6" />

  <!-- Letter A -->
  <line class="white" x1="160" y1="115" x2="160" y2="340" />
  <line class="white" x1="160" y1="115" x2="90" y2="220" />
  <circle class="dot-white" cx="160" cy="340" r="6" />
  <circle class="dot-white" cx="90" cy="220" r="6" />

  <!-- Letter C -->
  <line class="white" x1="240" y1="115" x2="240" y2="245" />
  <line class="white" x1="240" y1="115" x2="295" y2="115" />
  <line class="white" x1="240" y1="245" x2="295" y2="245" />
  <circle class="dot-white" cx="295" cy="115" r="6" />
  <circle class="dot-white" cx="295" cy="245" r="6" />
  
  <!-- Text -->
  <text x="200" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">A.I. CLUB</text>
</svg>
